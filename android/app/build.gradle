plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.andrewnicks.rollupos'
    compileSdk 34

    defaultConfig {
        applicationId "com.andrewnicks.rollupos"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            def ksFile = file("rollupos-release.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "rollupos2026"
                keyAlias System.getenv("KEY_ALIAS") ?: "rollupos"
                keyPassword System.getenv("KEY_PASSWORD") ?: "rollupos2026"
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("rollupos-release.jks").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
