name: Build & Release RollupOS Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Signing Keystore
        working-directory: android/app
        run: |
          if [ ! -f rollupos-release.jks ]; then
            keytool -genkeypair -v \
              -keystore rollupos-release.jks \
              -alias rollupos \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass rollupos2026 \
              -keypass rollupos2026 \
              -dname "CN=RollupOS Hub, OU=Mobile, O=Andrew Nicks, L=Kansas City, ST=MO, C=US"
          fi

      - name: Compile & Test Signed Release APK
        working-directory: android
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Copy RollupOS.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk RollupOS.apk
          ls -lh RollupOS.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RollupOS-APK
          path: RollupOS.apk

      - name: Publish / Update GitHub Release (RollupOS.apk v1.3.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 RollupOS.apk --clobber
          else
            gh release create v1.3.0 RollupOS.apk \
              --latest \
              --title "RollupOS v1.3.0 — 2-Way Office PC Sync, Gallery Watermark Save & Multi-Photo Share" \
              --notes "Upgraded Android WebView Host v1.3.0: 2-Way Office PC Wi-Fi Drop LAN Sync (/api/wifi-drop/* over 10.x/192.168.x/172.16-31.x/100.64-127.x with 60s zip transfer timeout), MediaStore Pictures/CSC_Site_Discovery Gallery photo saves, Intent.ACTION_SEND_MULTIPLE multi-photo native sharing, broadened .cscwalk.zip file-chooser MIME handling, plus USB-C OTG OBD-II read-only UDS bridge."
          fi
