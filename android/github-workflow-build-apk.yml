name: Build & Release RollupOS Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Signing Keystore
        working-directory: android/app
        run: |
          if [ ! -f rollupos-release.jks ]; then
            keytool -genkeypair -v \
              -keystore rollupos-release.jks \
              -alias rollupos \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass rollupos2026 \
              -keypass rollupos2026 \
              -dname "CN=RollupOS Hub, OU=Mobile, O=Andrew Nicks, L=Kansas City, ST=MO, C=US"
          fi

      - name: Compile Signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Copy RollupOS.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk RollupOS.apk
          ls -lh RollupOS.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RollupOS-APK
          path: RollupOS.apk

      - name: Publish / Update GitHub Release (RollupOS.apk v1.1.0 + v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 RollupOS.apk --clobber
          else
            gh release create v1.1.0 RollupOS.apk \
              --latest \
              --title "RollupOS Multi-User Android Hub v1.1.0 (Mic + GNSS + Camera Torch + Native File Export)" \
              --notes "Upgraded Android WebView Host v1.1.0: Native RECORD_AUDIO (150Hz WebAudio Mic), ACCESS_FINE_LOCATION (GNSS), Sequential Camera/Torch Permissions, and RollupNative.saveBase64File (.cscwalk.zip, .csv, .json direct Downloads)."
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 RollupOS.apk --clobber || true
          fi
