<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>Field Snap &amp; Notes — RollupOS Mini-App</title>
<script src="../../bridge/rollup-bridge.js?v=1.1"></script>
<style>
  body {
    margin: 0;
    padding: 0 0 90px 0;
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, sans-serif;
  }
  .shell { max-width: 480px; margin: 0 auto; padding: 14px; }
  .card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
  }
  .btn {
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn-sec { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; }
  input, textarea {
    width: 100%;
    background: #090d16;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #f8fafc;
    padding: 8px 10px;
    font-size: 13px;
    margin-top: 6px;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div class="shell">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <div>
      <div style="font-size:10.5px;font-weight:800;color:#4ade80;text-transform:uppercase;">RollupBridge Camera + Storage</div>
      <h1 style="margin:2px 0 0 0;font-size:19px;">📸 Field Snap &amp; Quick Notes</h1>
    </div>
    <button class="btn btn-sec" onclick="exportUserNotes()">📤 Export CSV</button>
  </div>

  <div class="card">
    <div style="font-size:11.5px;color:#94a3b8;" id="user-badge"></div>
    <input type="text" id="note-project" placeholder="Project / Tag (e.g., Job Walk, Receipt, Prototype)">
    <textarea id="note-text" rows="3" placeholder="Type quick field note or observation..."></textarea>
    <div id="photo-preview-box" style="display:none;margin-top:8px;">
      <img id="photo-preview-img" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1px solid #334155;">
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-sec" style="flex:1;" onclick="snapPhoto()">📷 Snap / Attach Photo</button>
      <button class="btn" style="flex:1;" onclick="saveEntry()">💾 Save Entry</button>
    </div>
  </div>

  <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:#94a3b8;margin:12px 0 6px 2px;">
    Saved Entries (Isolated to Your Google Account)
  </div>
  <div id="entries-list"></div>
</div>

<script>
window.ROLLUP_APP_ID = 'field-snap';
let PENDING_PHOTO = null;

async function snapPhoto() {
  const photo = await RollupBridge.camera.capturePhoto();
  if (photo && photo.dataUrl) {
    PENDING_PHOTO = photo;
    document.getElementById('photo-preview-img').src = photo.dataUrl;
    document.getElementById('photo-preview-box').style.display = 'block';
  }
}

function saveEntry() {
  const proj = document.getElementById('note-project').value.trim() || 'General';
  const text = document.getElementById('note-text').value.trim();
  if (!text && !PENDING_PHOTO) return;

  const list = RollupBridge.storage.get('entries', []);
  list.unshift({
    id: Date.now(),
    project: proj,
    text,
    photo: PENDING_PHOTO ? PENDING_PHOTO.dataUrl : null,
    created_at: new Date().toLocaleString()
  });
  RollupBridge.storage.set('entries', list);
  document.getElementById('note-text').value = '';
  PENDING_PHOTO = null;
  document.getElementById('photo-preview-box').style.display = 'none';
  renderEntries();
}

function deleteEntry(id) {
  const list = RollupBridge.storage.get('entries', []).filter(x => x.id !== id);
  RollupBridge.storage.set('entries', list);
  renderEntries();
}

function exportUserNotes() {
  const list = RollupBridge.storage.get('entries', []).map(e => ({
    created_at: e.created_at,
    project: e.project,
    note: e.text,
    has_photo: Boolean(e.photo)
  }));
  if (list.length === 0) return alert('No entries to export yet.');
  RollupBridge.files.exportCSV('field_snap_notes.csv', list);
}

function renderEntries() {
  const list = RollupBridge.storage.get('entries', []);
  const box = document.getElementById('entries-list');
  if (list.length === 0) {
    box.innerHTML = `<div class="card" style="color:#64748b;text-align:center;font-size:12px;">No notes saved for your profile yet.</div>`;
    return;
  }
  box.innerHTML = list.map(e => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="background:#052e16;color:#4ade80;border:1px solid #166534;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;">${e.project}</span>
        <span style="font-size:10px;color:#64748b;">${e.created_at} <button onclick="deleteEntry(${e.id})" style="background:none;border:none;color:#f87171;cursor:pointer;font-weight:700;">✕</button></span>
      </div>
      <div style="font-size:13px;color:#f8fafc;margin-top:7px;">${e.text || ''}</div>
      ${e.photo ? `<img src="${e.photo}" style="width:100%;max-height:190px;object-fit:cover;border-radius:8px;margin-top:8px;">` : ''}
    </div>
  `).join('');
}

RollupBridge.mountInAppConsolePill({ appId: 'field-snap', visibility: 'restricted' });
const u = RollupBridge.auth.getCurrentUser();
const cfg = RollupBridge.user.getAppConfig('field-snap');
document.getElementById('user-badge').textContent = `👤 Active Storage Bucket: ${u ? u.email : 'guest'}`;
if (cfg && cfg.default_project) {
  document.getElementById('note-project').value = cfg.default_project;
}
renderEntries();
</script>
</body>
</html>
