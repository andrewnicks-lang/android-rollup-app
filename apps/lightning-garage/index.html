<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>Blue Oval Garage — Ford &amp; Lincoln FORScan Companion (2011–2026+)</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-main: #070b14;
      --bg-card: #0f172a;
      --bg-elevated: #1e293b;
      --border-col: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 0 0 84px 0;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Google Sans', 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
    }

    .app-shell {
      max-width: 860px;
      margin: 0 auto;
      padding: 10px 12px;
    }

    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: linear-gradient(135deg, #091326, #0f172a);
      border: 1px solid #1e3a8a;
      border-radius: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-sub {
      font-size: 11px;
      color: #93c5fd;
      margin-top: 2px;
    }

    .garage-switcher-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0b1324;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .desktop-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .dtab-btn {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #1e293b;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .dtab-btn.active {
      background: #172554;
      color: #38bdf8;
      border-color: #0284c7;
    }

    .tab-section { display: none; }
    .tab-section.active { display: block; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-col);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .card-accent {
      background: linear-gradient(145deg, #0c1930, #0f172a);
      border-color: #0284c7;
    }

    .mod-card {
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.1s ease;
      padding: 12px;
    }
    .mod-card:hover { border-color: #38bdf8; }
    .mod-card.mod-wanted { border-left: 3px solid #c084fc; }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 520px) {
      .stat-row { grid-template-columns: repeat(2, 1fr); }
      .desktop-tabs { display: none; }
    }

    .stat-box {
      background: #080d19;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 9px 8px;
      text-align: center;
      cursor: pointer;
    }
    .stat-num { font-size: 18px; font-weight: 900; }
    .stat-lbl { font-size: 10.5px; color: #94a3b8; margin-top: 2px; font-weight: 700; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
    }
    .pill-blue { background: #0c2a4d; color: #7dd3fc; border: 1px solid #0369a1; }
    .pill-green { background: #052e16; color: #6ee7b7; border: 1px solid #15803d; }
    .pill-amber { background: #451a03; color: #fcd34d; border: 1px solid #b45309; }
    .pill-red { background: #450a0a; color: #fca5a5; border: 1px solid #b91c1c; }
    .pill-purple { background: #2e1065; color: #d8b4fe; border: 1px solid #7e22ce; }
    .pill-dark { background: #090d16; color: #cbd5e1; border: 1px solid #334155; }
    .pill-muted { background: #111827; color: #94a3b8; border: 1px solid #1f2937; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-primary { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
    .btn-blue { background: #1e3a8a; color: #bae6fd; border-color: #3b82f6; }
    .btn-secondary { background: #1e293b; color: #e2e8f0; border-color: #334155; }
    .btn-amber { background: #78350f; color: #fde68a; border-color: #f59e0b; }
    .btn-danger { background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .field-input {
      width: 100%;
      background: #070b14;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px 12px;
      font-size: 11.5px;
    }
    @media (max-width: 560px) {
      .kv-grid { grid-template-columns: 1fr; }
    }
    .kv-label { color: #94a3b8; }

    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .chip-btn {
      background: #090e1a;
      color: #94a3b8;
      border: 1px solid #1e293b;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .star-btn {
      background: #090e1a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 15px;
      cursor: pointer;
      color: #94a3b8;
    }
    .star-btn.active {
      background: #2e1065;
      border-color: #a855f7;
      color: #fbbf24;
    }

    .hex-diff-mini {
      margin-top: 7px;
      padding: 5px 8px;
      background: #070b14;
      border: 1px solid #1e293b;
      border-radius: 7px;
      font-size: 11.5px;
      font-family: monospace;
      color: #cbd5e1;
      overflow-x: auto;
    }

    .alert {
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 11.5px;
      line-height: 1.4;
    }
    .alert-green { background: #052e16; border: 1px solid #15803d; color: #dcfce7; }
    .alert-amber { background: #451a03; border: 1px solid #b45309; color: #fef3c7; }
    .alert-red { background: #450a0a; border: 1px solid #dc2626; color: #fee2e2; }

    /* Modal Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9500;
      background: rgba(3, 7, 18, 0.84);
      backdrop-filter: blur(5px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px 16px 0 0;
      padding: 16px;
      box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.75);
    }

    /* Sticky Bottom Mobile Navigation */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9000;
      background: rgba(7, 11, 20, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid #1e293b;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)) 4px;
    }
    .mnav-btn {
      background: transparent;
      border: none;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 2px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .mnav-btn .ico { font-size: 16px; }
    .mnav-btn.active { color: #38bdf8; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9900;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #38bdf8;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      max-width: 92vw;
      text-align: center;
    }
    .toast.show { opacity: 1; }

    @media print {
      .mobile-bottom-nav, .desktop-tabs, .garage-switcher-bar, #rollup-console-pill { display: none !important; }
      body { background: #ffffff; color: #000000; padding: 0; }
      .card { background: #ffffff; border: 1px solid #cbd5e1; color: #000000; }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Top Brand Header -->
    <header class="brand-bar">
      <div>
        <div class="brand-title">🔵⚡ BLUE OVAL GARAGE <span style="font-size:11px;color:#38bdf8;font-weight:700;">v2.1</span></div>
        <div class="brand-sub">Ford &amp; Lincoln FORScan Companion (2011–2026+) • USB-C Live Backup, VIN Scanner &amp; As-Built Engine</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-secondary" style="padding:5px 9px;font-size:11px;" onclick="RollupBridge && RollupBridge.manuals.open('lightning-garage')">📖 Guide</button>
      </div>
    </header>

    <!-- Multi-Vehicle Garage Switcher Strip -->
    <div id="garage-switcher-strip" class="garage-switcher-bar"></div>

    <!-- Live Status Pill Strip -->
    <div id="top-status-strip" style="margin-bottom:10px;"></div>

    <!-- Desktop Navigation Tabs -->
    <nav class="desktop-tabs">
      <button class="dtab-btn active" data-tab-btn="truck" onclick="switchTab('truck')">🚘 Garage &amp; VIN</button>
      <button class="dtab-btn" data-tab-btn="mods" onclick="switchTab('mods')">🎛️ Mod Menu (183)</button>
      <button class="dtab-btn" data-tab-btn="modules" onclick="switchTab('modules')">🧩 Modules (87)</button>
      <button class="dtab-btn" data-tab-btn="backups" onclick="switchTab('backups')">🛡️ Backups &amp; Factory .ab</button>
      <button class="dtab-btn" data-tab-btn="plan" onclick="switchTab('plan')">📋 Session Plan (<span id="nav-badge-wanted">0</span>)</button>
    </nav>

    <!-- Sections -->
    <section id="sec-truck" class="tab-section active">
      <div id="truck-tab-content"></div>
    </section>

    <section id="sec-mods" class="tab-section">
      <div id="mods-tab-content"></div>
    </section>

    <section id="sec-modules" class="tab-section">
      <div id="modules-tab-content"></div>
    </section>

    <section id="sec-backups" class="tab-section">
      <div id="backups-tab-content"></div>
    </section>

    <section id="sec-plan" class="tab-section">
      <div id="plan-tab-content"></div>
    </section>
  </div>

  <!-- Mod Detail Slide-Up Modal -->
  <div id="mod-detail-modal" class="modal-backdrop" onclick="if(event.target===this) closeModDetailModal()">
    <div id="mod-detail-content" class="modal-sheet"></div>
  </div>

  <!-- Sticky Mobile 5-Tab Bottom Bar -->
  <nav class="mobile-bottom-nav">
    <button class="mnav-btn active" data-tab-btn="truck" onclick="switchTab('truck')">
      <span class="ico">🚘</span>
      <span>Garage/VIN</span>
    </button>
    <button class="mnav-btn" data-tab-btn="mods" onclick="switchTab('mods')">
      <span class="ico">🎛️</span>
      <span>Mod Menu</span>
    </button>
    <button class="mnav-btn" data-tab-btn="modules" onclick="switchTab('modules')">
      <span class="ico">🧩</span>
      <span>Modules</span>
    </button>
    <button class="mnav-btn" data-tab-btn="backups" onclick="switchTab('backups')">
      <span class="ico">🛡️</span>
      <span>Backups/.ab</span>
    </button>
    <button class="mnav-btn" data-tab-btn="plan" onclick="switchTab('plan')">
      <span class="ico">📋</span>
      <span>Plan (<span id="nav-badge-plan">0</span>)</span>
    </button>
  </nav>

  <div id="toast-banner" class="toast"></div>

  <script src="../../bridge/rollup-bridge.js?v=1.4"></script>
  <script src="./data/catalog_bundle.js?v=2.1"></script>
  <script src="./js/garage_engine.js?v=2.1"></script>
  <script src="./js/app.js?v=2.1"></script>
</body>
</html>
